<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfoptimize</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <span class="brand-logo-arc"></span>
          <span class="brand-logo-disc"></span>
          <span class="brand-logo-dot"></span>
        </div>
        <div>
          <div class="brand-name">PERFOPTIMIZE</div>
          <div class="brand-sub">cockpit d'optimisation</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div>interface locale <span id="version"></span></div>
        <div class="sidebar-foot-dim">moteur partagé avec la CLI</div>
      </div>
    </aside>

    <!-- ===== Main ===== -->
    <main class="main">
      <div class="topbar">
        <div class="topbar-session">
          <span class="dot dot-good pulse"></span>
          <span class="topbar-kicker">session</span>
          <span id="topbar-game" class="topbar-game">—</span>
          <span id="topbar-pid" class="topbar-pid"></span>
        </div>
        <div class="topbar-right">
          <button id="alert-chip" class="alert-chip hidden" title="Alertes actives — voir le Moniteur">⚠ <span id="alert-count">0</span></button>
          <span id="pm-chip" class="pm-chip">PresentMon</span>
          <button id="quit" class="btn-quit"><span class="quit-square"></span>Quitter</button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <div id="quit-overlay" class="quit-overlay hidden">
    <div class="quit-overlay-inner">
      <div class="quit-overlay-title">Perfoptimize arrêté</div>
      <div class="quit-overlay-sub">Tu peux fermer cet onglet en toute sécurité.</div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script src="/session-fidelity.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfoptimize</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><div class="lring"></div><div class="hole"></div><div class="dot"><i></i></div></div>
        <div>
          <div class="brand-name">PERFOPTIMIZE</div>
          <div class="brand-sub">cockpit d'optimisation</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div><span id="version">v0.17</span> · interface locale</div>
        <div class="dim">moteur partagé avec la CLI</div>
      </div>
    </aside>

    <!-- ===== Main ===== -->
    <main class="main">
      <div class="topbar">
        <div class="session">
          <span class="live-dot" id="session-dot"></span>
          <span class="kicker">session</span>
          <span class="game" id="session-game">Recherche…</span>
          <span class="pid" id="session-pid"></span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex:none">
          <span class="pm-chip" id="pm-chip">PresentMon · …</span>
          <button class="btn quit" id="quit"><i></i>Quitter</button>
        </div>
      </div>
      <div class="content" id="view"></div>
    </main>
  </div>

  <div class="overlay hidden" id="quit-overlay">
    <div>
      <h2>Perfoptimize arrêté</h2>
      <p>Tu peux fermer cet onglet en toute sécurité.</p>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>

name: Alpha Windows package

on:
  push:
    branches: ["main", "feature/alpha-distribution"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Perfoptimize.sln -r win-x64

      - name: Test
        run: dotnet test Perfoptimize.sln --configuration Release --verbosity normal

      - name: Publish self-contained Windows build
        run: >-
          dotnet publish src/Perfoptimize.App/Perfoptimize.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output alpha-out

      - name: Add tester notes
        shell: pwsh
        run: |
          @'
          PERFOPTIMIZE — ALPHA WINDOWS x64

          Version expérimentale destinée aux tests sur de vraies machines.

          1. Décompresse entièrement l'archive.
          2. Lance Perfoptimize.exe.
          3. Windows peut afficher un avertissement car cette alpha n'est pas encore signée.
          4. Une analyse seule ne modifie jamais le PC.
          5. Toute modification doit être prévisualisée puis confirmée dans l'interface.
          6. Après une analyse, utilise « Exporter le rapport » pour partager le rapport JSON de test.

          Le rapport exporté ne contient volontairement ni nom d'utilisateur Windows ni chemin absolu de configuration.
          '@ | Set-Content -Path alpha-out\LISEZ-MOI-ALPHA.txt -Encoding UTF8

      - name: Create archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path alpha-out\* -DestinationPath Perfoptimize-alpha-win-x64.zip -Force
          (Get-FileHash Perfoptimize-alpha-win-x64.zip -Algorithm SHA256).Hash.ToLower() |
            Set-Content -Path Perfoptimize-alpha-win-x64.sha256 -Encoding ascii

      - name: Upload alpha package
        uses: actions/upload-artifact@v4
        with:
          name: Perfoptimize-alpha-win-x64
          path: |
            Perfoptimize-alpha-win-x64.zip
            Perfoptimize-alpha-win-x64.sha256
          if-no-files-found: error
          retention-days: 30
